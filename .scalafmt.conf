version = "3.10.7"
runner.dialect = scala213

maxColumn = 120
docstrings.style = Asterisk
newlines.source = keep
rewrite.rules = [RedundantParens, SortModifiers]
rewrite.trailingCommas.style = "multiple"

align.preset = some
align.allowOverflow = true
align.tokens."+" = [
  { code = "=", owners = [{ regex = "Defn.(Val|Var)" }] }
  { code = "//" }
  { code = "->" }
]